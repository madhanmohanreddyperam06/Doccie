databases:
  - name: todo-db
    databaseName: todo_db
    user: todo_user
    region: oregon
    plan: free

services:
  - type: web
    name: doccie-agent
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DB_FALLBACK_TO_SQLITE
        value: "false"
      - key: DB_CONNECT_TIMEOUT
        value: "15"
      - key: DB_MAX_RETRIES
        value: "6"
      - key: DB_RETRY_DELAY
        value: "3"
      - key: USE_MOCK_LLM
        value: "true"
      - key: GENERATED_DIR
        value: "generated"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LOG_LEVEL
        value: "INFO"
